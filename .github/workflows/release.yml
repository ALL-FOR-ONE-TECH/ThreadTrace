name: "Release ThreadTrace"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Universal Targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev build-essential curl wget file

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Desktop Application and Release Artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'ThreadTrace v__VERSION__'
          releaseBody: |
            ## 🕵️‍♂️ ThreadTrace v__VERSION__ Release
            
            ### ✨ What's Included:
            - **Native Ultra-Low Memory Binary (~18MB RAM)**
            - **Dynamic Custom Tag Engine (8 Phosphor Palettes)**
            - **Dynamic Auto-Bounding Spatial Radar Minimap**
            - **Real-Time System Resource Telemetry HUD**
            - **Git Watcher Live Commit & Diff Tracker**
            - **Curved Quadratic Bézier Evidence Links**
            - **Acid SQLite Local Persistence**
            
            ### 📦 Download Assets:
            - **Windows**: .msi or .exe Setup Installer
            - **macOS**: .dmg or Universal Binary
            - **Linux**: .AppImage or .deb
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
